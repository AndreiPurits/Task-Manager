{% extends 'tasks/base.html' %}

{% block content %}
<h2>My Tasks</h2>

{% if tasks %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Title</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
                <tr>
                    <td>{{ task.title }}</td>
                    <td>{{ task.get_priority_display }}</td>
                    <td>{{ task.due_date }}</td>
                    <td>
                        <a href="{% url 'task_update' task.id %}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{% url 'task_delete' task.id %}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No tasks found.</p>
{% endif %}

<a href="{% url 'task_create' %}" class="btn btn-primary">Create New Task</a>

{% endblock %}
